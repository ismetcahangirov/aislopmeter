# Push a tag like v0.2.1 to publish: npm package, Claude Desktop extension (.mcpb) on the GitHub release.
# npm needs a repository secret NPM_TOKEN (npmjs.com > Access Tokens > Granular, publish rights).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Pack the Claude Desktop extension
        run: npx -y @anthropic-ai/mcpb pack dist/mcpb dist/aislopmeter.mcpb
      - name: GitHub release with the extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/aislopmeter.mcpb --title "$GITHUB_REF_NAME" --generate-notes
      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: Move the major tag (uses omergocmen/aislopmeter@v0)
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major"
          git push -f origin "$major"
